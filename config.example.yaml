# p2pool-go-VTC Configuration

# The network to run on. For Vertcoin mainnet, this must be "vertcoin".
network: "vertcoin"

# Set to true if running on a testnet (requires a testnet vertcoind daemon).
testnet: false

# --- P2P Network Peers (go-libp2p) ---
# Local LAN nodes on the same network are discovered automatically via mDNS.
# To connect to remote internet p2pool-go-VTC nodes, list their full libp2p
# multiaddr (printed in the startup log as "P2P Connect Multiaddr").
# Note: This Go mesh does not connect to legacy Python P2Pool nodes.
peers:
  - "/ip4/138.68.53.157/tcp/9348/p2p/12D3KooWNiQ2TSXEhFgZrsJuuk9xxNheph8b23pK4RHaPSQFNDwU"
  - "/dns4/p2poolvtc.com/tcp/9348/p2p/12D3KooWNiQ2TSXEhFgZrsJuuk9xxNheph8b23pK4RHaPSQFNDwU"
#  - "/ip4/203.0.113.50/tcp/9348/p2p/12D3KooWL65LCCkfLnN2PaEjdXUm4BBHj24nzpABPhDatjNzPKwi"


# --- RPC Connection Settings ---
# These must match the RPC settings in your vertcoin.conf file.
rpcHost: "127.0.0.1"
rpcPort: 5888
rpcUser: "your_rpc_user"
rpcPass: "your_rpc_password"


# --- Pool Settings ---
# Your Vertcoin address for receiving the pool operator fee directly in the coinbase transaction.
poolAddress: "vtc1qx9wlulctjps59jnlcg04z3jwnkku5tgwkj0j0l"

# The fee (in percent) that the node embeds for the pool operator in solved blocks (e.g., 1.0 = 1%).
fee: 1.0

# How many shares are considered in the rolling PPLNS window when calculating direct coinbase payouts.
pplns_window: 2160


# --- Port Settings ---
# Multiplexed port (cmux) for both Stratum miner connections and the HTTP Web Dashboard.
stratumPort: 9172

# The TCP port for go-libp2p GossipSub and Kademlia DHT node-to-node communication.
# Port-forward this port (9348/tcp) on your router if connecting with external internet peers.
p2pPort: 9348


# --- General Settings ---
# The level of detail for console and p2pool.log output.
# Options: "debug", "info", "warn", "error"
# Recommended: "info" (shows accepted shares, consensus checks, and found blocks).
loglevel: "info"


# --- Verthash Settings ---
# Full path to your verthash.dat file (approx. 1.2 GB).
# Standard install example: "/home/user/.vertcoin/verthash.dat"
# Snap install example:     "/home/user/snap/vertcoin-core/common/.vertcoin/verthash.dat"
verthash_dat_file: "/home/user/.vertcoin/verthash.dat"


# --- Variable Difficulty (Vardiff) Settings ---
# Automatically adjusts individual miner share difficulty to maintain steady submissions.
vardiff:
  # Target time (in seconds) between shares submitted by a miner.
  targetTime: 5.0

  # How often (in seconds) the pool evaluates a miner's submission rate to adjust difficulty.
  # Should be 2x to 6x longer than targetTime.
  retargetTime: 30.0

  # Allowed fractional variance from targetTime before triggering a difficulty change (0.30 = ±30%).
  variance: 0.30

  # Minimum share difficulty floor assigned to miners on connect.
  minDiff: 0.01
